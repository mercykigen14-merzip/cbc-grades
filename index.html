<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBC Grades Kenya</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f0fdf4;padding:15px}.card{max-width:500px;margin:20px auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}.h{background:#16a34a;color:#fff;padding:25px;text-align:center}.b{padding:20px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.g div{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;text-align:center}input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:6px 0 12px}.btn{width:100%;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:16px}#res{margin-top:15px;padding:15px;border-radius:10px;text-align:center;display:none}</style></head><body><div class="card"><div class="h"><h1>🇰🇪 CBC GRADES</h1><p>Kenya CBC Calculator</p></div><div class="b"><div class="g"><div><b>EE</b><br><small>80-100%</small></div><div><b>ME</b><br><small>60-79%</small></div><div><b>AE</b><br><small>40-59%</small></div><div><b>BE</b><br><small>0-39%</small></div></div><label>Student Name</label><input id="n" placeholder="e.g. John Kamau"><label>Subject</label><select id="sub"><option>Mathematics</option><option>English</option><option>Kiswahili</option><option>Science & Tech</option><option>Social Studies</option><option>CRE</option></select><label>Score %</label><input id="s" type="number" placeholder="75"><button class="btn" onclick="c()">Calculate Grade</button><div id="res"></div></div></div><script>function c(){let sc=document.getElementById('s').value;let nm=document.getElementById('n').value||'Student';let r=document.getElementById('res');sc=parseInt(sc);if(isNaN(sc)){alert('Enter score');return}let g,d,bg;if(sc>=80){g='EE';d='Exceeding Expectation - Excellent!';bg='#dcfce7'}else if(sc>=60){g='ME';d='Meeting Expectation - Good Work!';bg='#dbeafe'}else if(sc>=40){g='AE';d='Approaching Expectation - Keep Improving';bg='#fef9c3'}else{g='BE';d='Below Expectation - Needs Support';bg='#ffedd5'}r.style.display='block';r.style.background=bg;r.innerHTML='<h1 style=font-size:40px>'+g+'</h1><b>'+nm+' - '+sc+'%</b><p style=margin-top:8px>'+d+'</p>'} </script></body></html>
